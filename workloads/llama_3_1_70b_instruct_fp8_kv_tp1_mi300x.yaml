# amd/Llama-3.1-70B-Instruct-FP8-KV on MI300X (migrated from vllm-dashboard nightly)
name: llama-3-1-70b-instruct-fp8-kv-tp1-mi300x
gpu: MI300X
num_gpus: 8
nightly: true

vllm:
  model: amd/Llama-3.1-70B-Instruct-FP8-KV
  env:
    VLLM_ROCM_USE_AITER: 1
  serve_args: >-
    --tensor-parallel-size 1
    --kv-cache-dtype fp8
    --trust-remote-code
    --no-enable-prefix-caching

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    add_bos_token: true
    trust_remote_code: true
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
