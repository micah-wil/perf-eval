# deepseek-ai/DeepSeek-R1-0528 on MI355X (migrated from vllm-dashboard nightly)
name: deepseek-r1-0528-mi355x
gpu: MI355X
num_gpus: 8
nightly: true
timeout_in_minutes: 240

vllm:
  model: deepseek-ai/DeepSeek-R1-0528
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_ENGINE_READY_TIMEOUT_S: "5400"
    OMP_NUM_THREADS: 1
  serve_args: >-
    --tensor-parallel-size 8
    --max-model-len 32768
    --trust-remote-code
    --no-enable-prefix-caching

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    add_bos_token: true
    trust_remote_code: true
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
