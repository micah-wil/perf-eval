# amd/gpt-oss-120b-w-mxfp4-a-fp8 on MI355X (migrated from vllm-dashboard nightly)
name: gpt-oss-120b-w-mxfp4-a-fp8-tp8-mi355x
gpu: MI355X
num_gpus: 8
nightly: true

vllm:
  model: amd/gpt-oss-120b-w-mxfp4-a-fp8
  env:
    VLLM_ROCM_USE_AITER: 1
  serve_args: >-
    --tensor-parallel-size 8
    --kv-cache-dtype fp8
    --trust-remote-code
    --no-enable-prefix-caching

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    add_bos_token: true
    trust_remote_code: true
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_gen_toks: 2048

vllm_bench:
  configs:
    - name: 1k-in-1k-out-conc-8
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 80
      max_concurrency: 8
      args:
        num_warmups: 1
        temperature: 0
    - name: 1k-in-1k-out-conc-16
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 160
      max_concurrency: 16
      args:
        num_warmups: 1
        temperature: 0
    - name: 1k-in-1k-out-conc-128
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 1280
      max_concurrency: 128
      args:
        num_warmups: 1
        temperature: 0
