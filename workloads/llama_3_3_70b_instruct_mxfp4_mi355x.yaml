# amd/Llama-3.3-70B-Instruct-MXFP4-Preview on MI355X (migrated from vllm-dashboard nightly)
name: llama-3-3-70b-instruct-mxfp4-mi355x
gpu: MI355X
num_gpus: 8
nightly: true

vllm:
  model: amd/Llama-3.3-70B-Instruct-MXFP4-Preview
  env:
    VLLM_ROCM_USE_AITER: 1
  serve_args: >-
    --tensor-parallel-size 1
    --kv-cache-dtype fp8
    --async-scheduling
    --attention_config.backend ROCM_AITER_UNIFIED_ATTN
    --trust-remote-code
    --no-enable-prefix-caching

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    add_bos_token: true
    trust_remote_code: true
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64

vllm_bench:
  configs:
    - name: 1k-in-1k-out-conc-1
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 10
      max_concurrency: 1
      args:
        num_warmups: 1
        temperature: 0
    - name: 1k-in-1k-out-conc-64
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 640
      max_concurrency: 64
      args:
        num_warmups: 1
        temperature: 0
    - name: 1k-in-1k-out-conc-128
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 1280
      max_concurrency: 128
      args:
        num_warmups: 1
        temperature: 0
