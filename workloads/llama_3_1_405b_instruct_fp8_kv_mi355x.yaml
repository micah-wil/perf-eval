# amd/Llama-3.1-405B-Instruct-FP8-KV on MI355X (migrated from vllm-dashboard nightly)
name: llama-3-1-405b-instruct-fp8-kv-mi355x
gpu: MI355X
num_gpus: 8
nightly: true

vllm:
  model: amd/Llama-3.1-405B-Instruct-FP8-KV
  env:
    VLLM_ROCM_USE_AITER: 1
  serve_args: >-
    --tensor-parallel-size 8
    --dtype float16
    --trust-remote-code
    --no-enable-prefix-caching

vllm_bench:
  configs:
    - name: 1k-in-1k-out-conc-1
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 10
      max_concurrency: 1
      args:
        num_warmups: 1
        temperature: 0
    - name: 1k-in-1k-out-conc-64
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 640
      max_concurrency: 64
      args:
        num_warmups: 1
        temperature: 0
