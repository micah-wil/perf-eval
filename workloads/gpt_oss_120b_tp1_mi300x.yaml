# openai/gpt-oss-120b on MI300X (migrated from vllm-dashboard nightly)
name: gpt-oss-120b-tp1-mi300x
gpu: MI300X
num_gpus: 8
nightly: true

vllm:
  model: openai/gpt-oss-120b
  env:
    VLLM_ROCM_USE_AITER: 1
  serve_args: >-
    --tensor-parallel-size 1
    --kv-cache-dtype fp8
    --trust-remote-code
    --no-enable-prefix-caching

vllm_bench:
  configs:
    - name: 1k-in-1k-out-conc-8
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 80
      max_concurrency: 8
      args:
        num_warmups: 1
        temperature: 0
    - name: 1k-in-1k-out-conc-16
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 160
      max_concurrency: 16
      args:
        num_warmups: 1
        temperature: 0
    - name: 1k-in-1k-out-conc-128
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 1280
      max_concurrency: 128
      args:
        num_warmups: 1
        temperature: 0
