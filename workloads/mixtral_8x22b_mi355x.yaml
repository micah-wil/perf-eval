# mistralai/Mixtral-8x22B-Instruct-v0.1 on MI355X (migrated from vllm-dashboard nightly)
name: mixtral-8x22b-mi355x
gpu: MI355X
num_gpus: 8
nightly: true

vllm:
  model: mistralai/Mixtral-8x22B-Instruct-v0.1
  env:
    VLLM_ROCM_USE_AITER: 1
  serve_args: >-
    --tensor-parallel-size 8
    --trust-remote-code
    --no-enable-prefix-caching

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    add_bos_token: true
    trust_remote_code: true
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64

vllm_bench:
  configs:
    - name: 1k-in-1k-out-conc-1
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 10
      max_concurrency: 1
      args:
        num_warmups: 1
        temperature: 0
    - name: 1k-in-1k-out-conc-64
      backend: openai
      dataset: random
      input_len: 1024
      output_len: 1024
      num_prompts: 640
      max_concurrency: 64
      args:
        num_warmups: 1
        temperature: 0
